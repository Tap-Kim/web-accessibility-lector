<!doctype html>
<!-- 문서의 기본 언어를 한국어로 지정해 보조기술의 발음을 돕습니다. -->
<html lang="ko">
  <head>
    <!-- 한글을 포함한 문자를 UTF-8로 해석합니다. -->
    <meta charset="UTF-8" />
    <!-- 화면 너비를 기기에 맞추고 초기 배율을 설정합니다. 확대는 제한하지 않습니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 검색 결과 등에서 페이지의 목적을 설명하는 요약입니다. -->
    <meta
      name="description"
      content="상품 탐색, 장바구니, 로그인을 예제로 웹 접근성을 점검하는 2단계 실습 페이지입니다."
    />
    <!-- 브라우저 탭과 페이지 탐색에서 구분할 수 있는 문서 이름입니다. -->
    <title>웹 접근성 실습 2단계 - 기본 개선</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 스킵 링크 -->
    <a
      href="#main-content"
      class="skip-link skip-link-icon"
      aria-label="메인 콘텐츠로 바로가기"
      title="메인 콘텐츠로 바로가기"
      ><svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" /></svg
    ></a>

    <!-- 헤더 영역 -->
    <!-- TODO: 화면 배치 없이도 페이지 상단의 역할을 파악할 수 있는지 확인해보세요. -->
    <div class="header">
      <div class="header-container">
        <div class="logo brand">
          <!-- TODO: 로고 그림을 보지 않고도 이 기능의 목적을 알 수 있는지 확인해보세요. -->
          <button onclick="goHome()" class="logo-btn">
            <svg
              height="44"
              viewBox="0 0 14 44"
              width="14"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="m13.0729 17.6825a3.61 3.61 0 0 0 -1.7248 3.0365 3.5132 3.5132 0 0 0 2.1379 3.2223 8.394 8.394 0 0 1 -1.0948 2.2618c-.6816.9812-1.3943 1.9623-2.4787 1.9623s-1.3633-.63-2.613-.63c-1.2187 0-1.6525.6507-2.644.6507s-1.6834-.9089-2.4787-2.0243a9.7842 9.7842 0 0 1 -1.6628-5.2776c0-3.0984 2.014-4.7405 3.9969-4.7405 1.0535 0 1.9314.6919 2.5924.6919.63 0 1.6112-.7333 2.8092-.7333a3.7579 3.7579 0 0 1 3.1604 1.5802zm-3.7284-2.8918a3.5615 3.5615 0 0 0 .8469-2.22 1.5353 1.5353 0 0 0 -.031-.32 3.5686 3.5686 0 0 0 -2.3445 1.2084 3.4629 3.4629 0 0 0 -.8779 2.1585 1.419 1.419 0 0 0 .031.2892 1.19 1.19 0 0 0 .2169.0207 3.0935 3.0935 0 0 0 2.1586-1.1368z"
              ></path>
            </svg>
          </button>
          <span class="brand-name">A11Y STORE</span>
        </div>
        <!-- TODO: 보조기술로 주요 메뉴를 찾고 다른 메뉴 영역과 구분할 수 있는지 확인해보세요. -->
        <div class="primary-nav">
          <div class="nav nav-list">
            <button class="nav-link" onclick="showProducts()">상품</button>
            <button class="nav-link" onclick="showCart()">장바구니</button>
            <button class="nav-link" onclick="showMyPage()">마이페이지</button>
          </div>
        </div>
        <!-- TODO: 아이콘을 보지 않고도 어떤 기능을 실행하는지 알 수 있는지 확인해보세요. -->
        <button onclick="toggleSearch()" class="search-btn">🔍</button>
      </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <!-- TODO: 반복되는 메뉴를 건너뛰고 본문을 바로 찾아갈 수 있는지 확인해보세요. -->
    <div id="main-content" class="main-content" tabindex="-1">
      <!-- 메인 배너 -->
      <!-- TODO: 이 영역을 따로 탐색해도 어떤 내용을 다루는지 알 수 있는지 확인해보세요. -->
      <div class="banner">
        <div class="banner-content">
          <h2 id="banner-title" class="banner-title">
            일상에 필요한 기기, 한곳에서 만나보세요
          </h2>
          <p class="banner-description">
            iPhone, MacBook, iPad를 둘러보고 나에게 맞는 제품을 골라보세요.
          </p>
        </div>
        <img class="hero-image" src="images/macbook.jpg" alt="" />
        <div class="banner-actions">
          <button onclick="showSale()" class="sale-btn">특가 상품 보기</button>
        </div>
      </div>

      <!-- 상품 목록 -->
      <!-- TODO: 상품 목록 영역을 찾았을 때 그 제목도 함께 파악할 수 있는지 확인해보세요. -->
      <div class="products">
        <div class="section-header">
          <h2 id="products-title" class="section-title">인기 상품</h2>
        </div>

        <div class="product-grid" role="list">
          <!-- TODO: 이 상품을 주변 내용과 구분해 하나의 정보 단위로 탐색할 수 있는지 확인해보세요. -->
          <div class="product-item" role="listitem">
            <!-- TODO: 이 항목을 실행하면 어떤 상품의 정보를 보게 되는지 알 수 있는지 확인해보세요. -->
            <button onclick="showProduct(1)" class="product-link">
              <!-- TODO: 이미지를 볼 수 없을 때도 어떤 상품인지 알 수 있는지 확인해보세요. -->
              <img class="product-image" src="images/iphone.jpg" />
              <h3 class="product-title">iPhone 16 Pro</h3>
              <p class="price">1,550,000원</p>
            </button>
            <!-- TODO: 같은 문구의 기능이 여러 개일 때 어느 상품을 담는지 구분할 수 있는지 확인해보세요. -->
            <button onclick="addToCart(1)" class="add-cart-btn">
              장바구니 담기
            </button>
            <button
              type="button"
              class="btn-secondary cart-view-btn"
              data-cart-product="1"
              onclick="showCart()"
              hidden
            >
              장바구니 보기
            </button>
          </div>

          <!-- TODO: 노트북 정보를 주변 상품과 구분해 탐색할 수 있는지 확인해보세요. -->
          <div class="product-item" role="listitem">
            <!-- TODO: 이 항목만 읽어도 어떤 상품의 상세 정보를 여는지 알 수 있는지 확인해보세요. -->
            <button onclick="showProduct(2)" class="product-link">
              <!-- TODO: 사진이 보이지 않아도 노트북에 관한 정보를 이해할 수 있는지 확인해보세요. -->
              <img class="product-image" src="images/macbook.jpg" />
              <h3 class="product-title">MacBook Pro14</h3>
              <p class="price">2,390,000원</p>
            </button>
            <!-- TODO: 이 기능이 노트북을 장바구니에 담는다는 점을 구분할 수 있는지 확인해보세요. -->
            <button onclick="addToCart(2)" class="add-cart-btn">
              장바구니 담기
            </button>
            <button
              type="button"
              class="btn-secondary cart-view-btn"
              data-cart-product="2"
              onclick="showCart()"
              hidden
            >
              장바구니 보기
            </button>
          </div>

          <!-- TODO: 태블릿 정보를 주변 상품과 구분해 탐색할 수 있는지 확인해보세요. -->
          <div class="product-item" role="listitem">
            <!-- TODO: 이 항목만 읽어도 태블릿의 상세 정보를 여는지 알 수 있는지 확인해보세요. -->
            <button onclick="showProduct(3)" class="product-link">
              <!-- TODO: 사진이 보이지 않아도 태블릿에 관한 정보를 이해할 수 있는지 확인해보세요. -->
              <img class="product-image" src="images/ipad.jpg" />
              <h3 class="product-title">iPad Pro 11</h3>
              <p class="price">1,599,000원</p>
            </button>
            <!-- TODO: 이 기능이 태블릿을 장바구니에 담는다는 점을 구분할 수 있는지 확인해보세요. -->
            <button onclick="addToCart(3)" class="add-cart-btn">
              장바구니 담기
            </button>
            <button
              type="button"
              class="btn-secondary cart-view-btn"
              data-cart-product="3"
              onclick="showCart()"
              hidden
            >
              장바구니 보기
            </button>
          </div>
        </div>
      </div>

      <!-- 장바구니: 기존 페이지의 접근성 실습 항목과 별개로 내역을 확인합니다. -->
      <section
        id="cart-panel"
        class="cart-panel"
        aria-labelledby="cart-title"
        hidden
      >
        <div class="cart-header">
          <h2 id="cart-title" class="section-title" tabindex="-1">장바구니</h2>
          <button type="button" class="btn-secondary" onclick="closeCart()">
            쇼핑 계속하기
          </button>
        </div>
        <p id="cart-empty" class="cart-empty">
          장바구니가 비어 있습니다. 상품을 담아보세요.
        </p>
        <ul id="cart-items" class="cart-items"></ul>
        <p
          id="cart-summary"
          class="cart-summary"
          role="status"
          aria-atomic="true"
        ></p>
      </section>

      <!-- 로그인 폼 -->
      <!-- TODO: 로그인 영역을 따로 탐색할 때 그 목적을 알 수 있는지 확인해보세요. -->
      <div class="login-section">
        <div class="login-header">
          <h2 id="login-title" class="section-title">로그인</h2>
        </div>
        <form class="form" onsubmit="return handleLogin(event)">
          <div class="form-group">
            <!-- TODO: 입력칸으로 이동했을 때 무엇을 입력해야 하는지 안내되는지 확인해보세요. -->
            <label class="form-label">아이디</label>
            <!-- TODO: 입력칸에 접근할 때 바로 아래의 도움말도 함께 전달되는지 확인해보세요. -->
            <input
              class="form-input"
              type="text"
              id="username"
              name="username"
              required
            />
            <!-- TODO: 이 도움말이 어느 입력칸을 위한 것인지 보조기술로 확인해보세요. -->
            <small class="form-help" id="username-help"
              >등록된 아이디를 입력하세요</small
            >
          </div>
          <div class="form-group">
            <!-- TODO: 입력칸을 따로 탐색해도 비밀번호를 입력하는 곳임을 알 수 있는지 확인해보세요. -->
            <label class="form-label">비밀번호</label>
            <!-- TODO: 비밀번호를 입력하기 전에 입력 조건을 안내받을 수 있는지 확인해보세요. -->
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              required
            />
            <!-- TODO: 이 입력 조건이 어느 입력칸에 해당하는지 보조기술로 확인해보세요. -->
            <small class="form-help" id="password-help"
              >8자 이상의 비밀번호를 입력하세요</small
            >
          </div>
          <button type="submit" class="login-btn">로그인</button>
        </form>
      </div>
    </div>

    <!-- 푸터 -->
    <!-- TODO: 페이지 하단 정보를 본문과 구분해 찾아갈 수 있는지 확인해보세요. -->
    <div class="footer">
      <div class="footer-container">
        <!-- TODO: 하단 메뉴를 찾고 상단 메뉴와 구분할 수 있는지 확인해보세요. -->
        <div>
          <ul class="footer-links">
            <li>
              <a class="footer-link" href="#" onclick="showTerms()">이용약관</a>
            </li>
            <li>
              <a class="footer-link" href="#" onclick="showPrivacy()"
                >개인정보처리방침</a
              >
            </li>
            <li>
              <a class="footer-link" href="#" onclick="showContact()"
                >고객센터</a
              >
            </li>
          </ul>
        </div>
        <p class="copyright">&copy; 2024. All rights reserved.</p>
      </div>
    </div>

    <!-- TODO: 화면을 보지 않고도 상품을 담은 결과를 알 수 있는지 확인해보세요. -->

    <div class="exercise-footer-note">웹 접근성 교육용 쇼핑몰 예제 - 2단계</div>

    <script src="script.js"></script>
  </body>
</html>
